baseURL: https://schofi.github.io/
title: Schofi's Blog
theme: PaperMod
locale: en-US
defaultContentLanguage: en
hasCJKLanguage: false
timeZone: Asia/Shanghai
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON]

taxonomies:
  tag: tags
  category: categories

params:
  env: production
  author: xiangxin
  description: Notes on AI agents, LLM training, and engineering. Learning through reading, experiments, and practice.
  keywords: [Schofi, xiangxin, AI agents, LLM, Agentic RL, engineering]
  mainSections: [posts]
  DateFormat: 'January 2, 2006'
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: false
  ShowWordCount: false
  ShowToc: true
  TocOpen: true
  UseHugoToc: true
  disableSpecial1stPost: true
  comments: false
  hideSummary: false
  assets:
    favicon: /favicon.svg
    safari_pinned_tab: /favicon.svg
    theme_color: '#376850'
    disableHLJS: true
  label:
    text: Schofi
  homeInfoParams:
    Title: "👋 Hi, I'm Schofi"
    Content: |
      Notes on learning, experiments, and ideas.

      Exploring **AI agents · LLM training · engineering**, one question at a time.
  socialIcons:
    - name: github
      title: GitHub
      url: https://github.com/Schofi
    - name: rss
      title: Subscribe via RSS
      url: /index.xml
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    ignoreLocation: true
    threshold: 0.35
    minMatchCharLength: 1
    limit: 20
    keys: [title, summary, content]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

markup:
  highlight:
    noClasses: false
    lineNos: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
