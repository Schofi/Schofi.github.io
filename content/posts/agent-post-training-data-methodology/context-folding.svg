<text x="42" y="74" dominant-baseline="text-before-edge" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="700" font-size="34" fill="#213d35">上下文管理：从原始历史到可用状态</text>
<text x="42" y="129" dominant-baseline="text-before-edge" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="400" font-size="21" fill="#5c7068">折叠旧步骤，保留任务依据与最新反馈，再生成下一步动作。</text>
