<polygon points="524,488 512.1834452542265,493.41932043157976 512.1834452542265,482.58067956842024" fill="#779285"/>
<text x="480" y="438" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="400" font-size="23" fill="#5c7068">折叠</text>
<polyline points="721,735 721,775 480,775 480,804" fill="none" stroke="#779285" stroke-width="3" stroke-linejoin="round"/>
<polygon points="480,804 474.58067956842024,792.1834452542265 485.41932043157976,792.1834452542265" fill="#779285"/>
<rect x="120" y="805" width="720" height="101" rx="15" fill="#e6f0e8" stroke="#779285"/>
<text x="480.0" y="822" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="700" font-size="27" fill="#213d35">模型输出新的折叠指令与下一步动作</text>
<text x="480.0" y="862" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="400" font-size="22" fill="#5c7068">执行器解析并应用折叠，随后执行工具</text>
<polyline points="480,906 480,944" fill="none" stroke="#779285" stroke-width="3" stroke-linejoin="round"/>
<polygon points="480,944 474.58067956842024,932.1834452542265 485.41932043157976,932.1834452542265" fill="#779285"/>
<rect x="120" y="945" width="720" height="101" rx="15" fill="#f6edda" stroke="#779285"/>
<text x="480.0" y="962" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="700" font-size="27" fill="#213d35">检查信息是否仍足够支持后续决策</text>
<text x="480.0" y="1002" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="400" font-size="22" fill="#5c7068">不能把未知写成已知；不能丢掉约束与证据</text>
<polyline points="42,1107 918,1107" fill="none" stroke="#d4dfd6" stroke-width="1" stroke-linejoin="round"/>
<text x="42" y="1129" dominant-baseline="text-before-edge" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="400" font-size="19" fill="#5c7068">图 3  /  原始日志独立归档；上下文长度取决于摘要与运行时策略。</text>
